name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          pip install -q pytest peft torch --index-url https://download.pytorch.org/whl/cpu
      - name: Gate unit tests (CPU)
        run: |
          python -m pytest tests/ -q
