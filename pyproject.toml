[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ttrl2"
version = "0.1.0"
description = "Two-scale safety-gated test-time RL for tool-using agents (tau2-bench retail, Qwen3.5-4B)"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "torch>=2.11",
    "transformers>=4.57",
    "peft>=0.20",
    "trl>=1.10",
    "vllm>=0.26",
    "pydantic>=2.7",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "matplotlib>=3.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ttrl2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
